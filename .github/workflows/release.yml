---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  LINUX_DEPS: >-
    gcc pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev
    libxcursor-dev libxi-dev libxxf86vm-dev libasound2-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Ebitengine Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          # macos-13 was retired by GitHub; cross-compile amd64 on arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Ebitengine Linux deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          BASE="open-backgammon-${TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w" \
            -o "open-backgammon${EXT}" ./cmd/backgammon
          if [ "${GOOS}" = "windows" ]; then
            7z a -tzip "dist/${BASE}.zip" "open-backgammon${EXT}"
          else
            tar -czf "dist/${BASE}.tar.gz" "open-backgammon"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: open-backgammon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
